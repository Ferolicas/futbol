global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/cfanalisis-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
  - job_name: postgres
    static_configs:
      - targets: ['127.0.0.1:9187']
  - job_name: redis
    static_configs:
      - targets: ['127.0.0.1:9121']
  - job_name: cfanalisis-worker
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/cfanalisis-worker.token
    static_configs:
      - targets: ['127.0.0.1:8080']
  - job_name: cfanalisis-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://127.0.0.1:3000/api/health
          - http://127.0.0.1:3100/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
