version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/cfanalisis-worker
    schedule:
      interval: weekly
      day: monday
      time: '02:20'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      worker-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:40'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
